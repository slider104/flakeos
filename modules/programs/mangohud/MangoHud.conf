# MangoHud (in-game overlay), baked into the wrapped `mangohud` command.
# Colours are appended from the palette by mangohud.nix.
# Docs: https://github.com/flightlessmango/MangoHud#hud-configuration
#
# Steam launch options: `mangohud %command%`   Toggle in-game: Right Shift + F12

position=top-left
font_size=20
round_corners=6
background_alpha=0.8
toggle_hud=Shift_R+F12

