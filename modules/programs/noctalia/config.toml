# Noctalia's settings. Baked into the store at rebuild (see noctalia.nix).
#
# Noctalia 5 reads TOML. Three layers, in this order:
#   1. its own defaults
#   2. this file
#   3. ~/.local/state/noctalia/settings.toml - everything you change in the
#      settings GUI (Mod+Comma) ends up there, and it wins over this file
# So the GUI keeps working even though this file is read-only in the store.
# `noctalia-changes` shows what layer 3 holds, `--save` moves it in here.
#
# Only settings that differ from noctalia's own defaults are here. The full
# list with every default: `noctalia config export full`, or example.toml in
# https://github.com/noctalia-dev/noctalia. Docs: https://docs.noctalia.dev
#
# Fonts and colours are NOT here: they come from the palette
# (modules/system/theme/palette.nix) and are added in noctalia.nix.
#
# Comments are written under the section they belong to, not above it: --save
# adds new settings at the end of their section, and a comment sitting right
# before the next section header would end up above them.
#
# ignore: wallpaper.default wallpaper.last wallpaper.monitors wallpaper.favorite
#   Keys `noctalia-changes` never shows and never saves. The four above are
#   the wallpaper you picked with Mod+W (per screen, plus the last one and
#   your favourites): noctalia only ever reads those from layer 3, so they
#   cannot be set from this file anyway, and they would put machine-specific
#   paths in a public repo. Add more keys here (dotted, space separated) when
#   something keeps showing up that you do not want in the repo. Deleting a
#   key from this file is not enough: it is still in layer 3, so the next
#   --save would write it back.
#   (This list is read from this file as it is on disk, so a change here
#   works at once, without a rebuild.)

[shell]
corner_radius_scale = 0.2  # 0 = square corners, 1 = noctalia's default
telemetry_enabled = false  # no startup ping (also noctalia's default)
setup_wizard_enabled = false  # the config is here; never ask on first start

[shell.animation]
speed = 2.0  # 2x faster than default

[shell.launcher]
# Mod+Space: a search field, the category row and the results, like the
# launcher in noctalia 4. Its own default is "full", which is wider and adds
# a profile row and view tabs - try it, it is one word.
layout = "simple"

[theme]
mode = "dark"
source = "custom"  # not a built-in theme: our palette, written by noctalia.nix
custom_palette = "flakeos"  # palettes/flakeos.json in the same folder

[theme.templates]
# Noctalia can also write theme files for other programs (GTK, terminals,
# ...). Ours are generated from the palette instead, so keep this off.
enable_builtin_templates = false
enable_community_templates = false

[bar.main]
# The bar. One is enough; it is called "main". The three lanes hold widget
# names: either an id noctalia knows (`launcher`, `tray`, ...) or a name from
# a [widget.<name>] section further down that says what `type` it is.
position = "top"
margin_ends = 0  # full width, no gap at the ends
margin_edge = 0  # flush with the screen edge
background_opacity = 0.0  # the bar itself is invisible ...
capsule = true  # ... only the widgets show, each in its own pill
capsule_opacity = 0.5
compositor_blur = false  # don't ask niri to blur the (invisible) bar
start = ["launcher", "group:sysmon", "active-window", "media"]
center = ["workspaces"]
end = ["tray", "notifications", "volume", "brightness", "clock", "control-center"]

[[bar.main.capsule_group]]
# CPU, temperature and memory in one shared pill, the way noctalia 4 drew its
# single system monitor widget. Dragging widgets onto each other in the
# settings GUI writes groups like this one.
id = "sysmon"
members = ["cpu", "cpu-temp", "ram"]
opacity = 0.5

[widget.launcher]
# The NixOS logo instead of a magnifier, in the accent colour. The image
# itself is a store path, so it is set in noctalia.nix.
custom_image_colorize = true
color = "primary"

[widget.cpu]
# One sysmon widget per value; the monospace font comes from the palette.
# Everything noctalia can show here: `stat` in its sysmon documentation.
type = "sysmon"
stat = "cpu_usage"

[widget.cpu-temp]
type = "sysmon"
stat = "cpu_temp"

[widget.ram]
type = "sysmon"
stat = "ram_used"

[widget.workspaces]
labels_only_when_occupied = true  # a number only where something is open
max_label_chars = 2

[widget.clock]
format = "{:%H:%M %a, %b %d}"
tooltip_format = "{:%A, %d %B %Y}"

[widget.control-center]
glyph = "power"

[wallpaper]
# The images from flakeos/wallpapers/, installed to /etc/wallpapers by
# noctalia.nix. Mod+W picks one; it stays across logins. A different one on a
# timer would be [wallpaper.automation].
directory = "/etc/wallpapers"

[location]
# Where you are: the weather in the control center, and sunrise/sunset.
address = "Gütersloh"
auto_locate = false  # no "ask the internet where this IP is"

[weather]
enabled = true
