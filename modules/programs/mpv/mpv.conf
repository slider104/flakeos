# mpv config, baked into the wrapped mpv. ~/.config/mpv is not used.
# Docs: https://mpv.io/manual/stable/

# GPU decoding + modern renderer (AMD / Vulkan).
hwdec=auto-safe
vo=gpu-next

# Don't close at the end of a file, remember where you stopped.
keep-open=yes
save-position-on-quit=yes

osd-font='Noto Sans'
